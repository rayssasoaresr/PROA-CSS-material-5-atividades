<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .item {
            background-color: #9da09d;
            color: #ffffff;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
        }

        .container1 {
            display: flex;
            background-color: #0b3116;
            margin-bottom: 20px;
            justify-content: flex-start;
        }

        .container2 {
            display: flex;
            background-color: #17491c;
            margin-bottom: 20px;
            justify-content: center;
        }

        .container3 {
            display: flex;
            background-color: #227b37;
            margin-bottom: 20px;
            justify-content: space-between;
        }

        .container4 {
            display: flex;
            background-color: #34c04d;
            margin-bottom: 20px;
            justify-content: space-around;
        }
    </style>
</head>
<body>

    <h3>1 - justify-content: flex-start</h3>
    <div class="container1">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>

    <h3>2 - justify-content: center</h3>
    <div class="container2">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>

    <h3>3 - justify-content: space-between</h3>
    <div class="container3">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>

    <h3>4 - justify-content: space-around</h3>
    <div class="container4">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>

</body>
</html>
