<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atividade 5- sem wrap</title>
    <style>
        .container {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
            background: rgb(154, 135, 164);
            padding: 20px;
        }

        .item {
            width: 150px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgb(242, 244, 245);
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Sem wrap</h2>
    <div class="container">
        <div class="item" style="background: rgb(108, 28, 6);">1</div>
        <div class="item" style="background: rgb(98, 255, 0);">2</div>
        <div class="item" style="background: rgb(13, 74, 105);">3</div>
        <div class="item" style="background: rgb(108, 235, 199);">4</div>
        <div class="item" style="background: rgb(7, 31, 48);">5</div>
        <div class="item" style="background: rgb(141, 59, 196);">6</div>
        <div class="item" style="background: rgb(205, 68, 169);">7</div>
        <div class="item" style="background: rgb(102, 28, 55);">8</div>
    </div>

</body>
</html>
