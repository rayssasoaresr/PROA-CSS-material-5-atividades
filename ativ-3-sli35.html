<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            display: flex;
            height: 120px;
            background-color: #dacbd4;
            margin-bottom: 20px;
        }

        .c1 { align-items: flex-start; }
        .c2 { align-items: center; }
        .c3 { align-items: flex-end; }
        .c4 { align-items: stretch; }

        .item1 { background-color: #d28eb7; color: white; padding: 10px; margin: 5px; border-radius: 5px; }
        .item2 { background-color: #cb3ead; color: white; padding: 10px; margin: 5px; border-radius: 5px; }
        .item3 { background-color: #a11693; color: white; padding: 10px; margin: 5px; border-radius: 5px; }
    </style>
</head>
<body>

    <h3>1 - align-items: flex-start</h3>
    <div class="container c1">
        <div class="item1">Item 1</div>
        <div class="item2">Item 2</div>
        <div class="item3">Item 3</div>
    </div>

    <h3>2 - align-items: center</h3>
    <div class="container c2">
        <div class="item1">Item 1</div>
        <div class="item2">Item 2</div>
        <div class="item3">Item 3</div>
    </div>

    <h3>3 - align-items: flex-end</h3>
    <div class="container c3">
        <div class="item1">Item 1</div>
        <div class="item2">Item 2</div>
        <div class="item3">Item 3</div>
    </div>

    <h3>4 - align-items: stretch</h3>
    <div class="container c4">
        <div class="item1">Item 1</div>
        <div class="item2">Item 2</div>
        <div class="item3">Item 3</div>
    </div>

</body>
</html>
