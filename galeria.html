<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        .galeria {
            display: flex;
            flex-wrap: wrap;
            /* quebra de linha */
            justify-content: center;
            /* centraliza */
            gap: 20px;
            /* espaço entre cards */
            padding: 20px;
            background-color: #f5f5f5;
        }

        .card {
            width: 250px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="galeria">
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ96dSBuNT7EVE3klZlIeEI8Ul730RgVaBENsVB_MmUZQ&s=10"
                alt="Imagem 1" width="200px" height="200">
            <p>Descrição da imagem 1</p>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0GYL6lcl7Gw3fhHf65sBE5O03p6IiTLkU97KZ4pDYYA&s=10"
                alt="Imagem 1" width="200px" height="200">
            <p>Descrição da imagem 2</p>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSkB8V6StC5kGU4kCQHDSC4WDjWFxze1UBcTS71H4XpOw&s=10"
                alt="Imagem 1" width="200px" height="200">
            <p>Descrição da imagem 3</p>
        </div>
    </div>

</body>

</html>
