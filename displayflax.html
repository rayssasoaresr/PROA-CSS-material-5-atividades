<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> display: flex</title>
     <style>
    .container {
  display: flex; /* ATIVA O FLEXBOX */
  background-color: #f0f0f0;
  padding: 20px;
}

.item {
  background-color: blue;
  color: white;
  padding: 20px;
  margin: 5px;
}


  </style>
</head>
<body>
 <div class="container"><!-- Pai -->
  <div class="item">1</div> <!-- Filho 1-->
  <div class="item">2</div> <!-- Filho 2-->
  <div class="item">3</div> <!-- Filho 3-->
</div>
</body>
</html>
