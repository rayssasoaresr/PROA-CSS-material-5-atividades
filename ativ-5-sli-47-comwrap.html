<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atividade 5-com wrap</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: lightgray;
            padding: 20px;
            max-width: 500px;
        }

        .item {
            width: 150px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Com wrap</h2>
    <div class="container">
        <div class="item" style="background: rgb(59, 2, 55);">1</div>
        <div class="item" style="background: rgb(113, 12, 93);">2</div>
        <div class="item" style="background: rgb(182, 34, 130);">3</div>
        <div class="item" style="background: rgb(188, 86, 142);">4</div>
        <div class="item" style="background: purple;">5</div>
        <div class="item" style="background: pink;">6</div>
        <div class="item" style="background: rgb(220, 148, 191);">7</div>
        <div class="item" style="background: rgb(220, 177, 197);">8</div>
    </div>

</body>
</html>
