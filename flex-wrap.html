<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-wrap</title>
    <style>
        .container-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #f3e5f5;
            padding: 20px;
            max-width: 500px;
        }

        .item {
            width: 150px;
            height: 100px;
            background: #6a1b9a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>


</head>

<body>
    <h2>Flex-wrap: wrap</h2>
    <p>Itens quebram para linha de baixo quando não cabem</p>

    <div class="container-wrap">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

</body>

</html>
